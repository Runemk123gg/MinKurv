<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MinKurv – sammenlign din indkøbskurv</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d2a24;--mute:#66736c;--line:#e2ded2;--accent:#1f7a4d;--accent-ink:#fff;--soft:#e6f2ea;--danger:#b3372b}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1d2621;--ink:#eaf1ec;--mute:#93a39a;--line:#2d3a33;--accent:#4cc38a;--accent-ink:#0c1812;--soft:#24372c;--danger:#ff8a7d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--mute);margin:2px 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{margin:0 0 10px;font-size:1.05rem}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.results{list-style:none;margin:10px 0 0;padding:0;max-height:340px;overflow:auto}
.results li{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
.results .n{flex:1}
.results small,.cat{color:var(--mute);font-size:.82rem}
.empty{color:var(--mute);padding:10px 2px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600}
.row{display:grid;grid-template-columns:1fr 110px;gap:8px;margin:10px 0}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
.basket{list-style:none;margin:0;padding:0}
.basket li{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.basket .n{flex:1;min-width:0}
.basket .n b{font-weight:600;overflow-wrap:anywhere}
.tag{font-size:.72rem;background:var(--soft);color:var(--accent);padding:1px 7px;border-radius:99px;margin-left:6px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;padding:0}
.qty span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.del{color:var(--danger)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mute)}
.link{background:none;border:0;color:var(--danger);padding:4px}
.scroll{overflow-x:auto}
table.cmp{border-collapse:collapse;width:100%;min-width:660px;font-size:.9rem}
.cmp th,.cmp td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:normal;min-width:140px}
.cmp input{width:80px;padding:6px 8px;text-align:right}
.cmp .tot td{font-weight:600;vertical-align:top}
.cmp td.best{background:var(--soft);color:var(--accent)}
.cmp small{font-weight:400;color:var(--mute)}
#verdict{margin:0 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Min<span>Kurv</span></h1>
  <p class="sub">Søg efter dagligvarer, byg din kurv og se, hvor den er billigst.</p>

  <div class="grid">
    <section class="card">
      <h2>Find varer</h2>
      <input id="q" type="search" placeholder="Søg fx mælk, rugbrød, hakket oksekød …" autocomplete="off" aria-label="Søg efter vare">
      <ul class="results" id="results"></ul>

      <details id="manual">
        <summary>Mangler varen? Tilføj den selv</summary>
        <div class="row">
          <div><label for="mName">Varens navn</label><input id="mName" placeholder="fx Skyr med vanilje 1 kg"></div>
          <div><label for="mQty">Antal</label><input id="mQty" type="number" min="1" value="1"></div>
        </div>
        <label for="mCat">Kategori (valgfri)</label>
        <select id="mCat"></select>
        <p style="margin:12px 0 0"><button class="primary" id="mAdd">Tilføj til kurv</button></p>
      </details>
    </section>

    <section class="card">
      <h2>Din kurv <span class="cat" id="count"></span></h2>
      <ul class="basket" id="basket"></ul>
      <div class="foot"><span id="sum"></span><button class="link" id="clear" hidden>Tøm kurven</button></div>
    </section>
  </div>
  <section class="card" style="margin-top:16px">
    <h2>Sammenlign priser</h2>
    <p class="sub" style="margin:0 0 10px">Skriv prisen pr. stk. (kr.) for hver vare i de butikker, du vil sammenligne. Priserne gemmes i din browser.</p>
    <p id="verdict"></p>
    <div class="scroll" id="cmp"></div>
  </section>
</div>

<script>
const CATS=["Mejeri & æg","Brød & bagværk","Frugt & grønt","Kød & fisk","Kolonial","Drikkevarer","Frost","Snacks & sødt","Husholdning","Andet"];
const CATALOG={
"Mejeri & æg":["Sødmælk 1 L","Letmælk 1 L","Skummetmælk 1 L","Minimælk 1 L","Kærnemælk 1 L","Piskefløde 250 ml","Madlavningsfløde 250 ml","Creme fraiche 18% 200 g","Smør 250 g","Letsaltet smør 250 g","Æg 10 stk.","Æg 12 stk.","Skyr naturel 1 kg","Yoghurt naturel 1 L","Revet ost 150 g","Cheddar 400 g","Danbo 45+ 400 g","Mozzarella 125 g","Feta 200 g","Hytteost 250 g","Flødeost 200 g","Remoulade 375 g"],
"Brød & bagværk":["Rugbrød 1 stk.","Toastbrød 500 g","Formbrød","Hvedeboller 8 stk.","Rundstykker 6 stk.","Tortillas 8 stk.","Pitabrød 6 stk.","Knækbrød 250 g","Wienerbrød"],
"Frugt & grønt":["Bananer 1 kg","Æbler 1 kg","Pærer 1 kg","Appelsiner 1 kg","Citron","Lime","Druer 500 g","Jordbær 400 g","Blåbær 125 g","Avocado","Agurk","Tomater 500 g","Cherrytomater 250 g","Peberfrugt","Gulerødder 1 kg","Kartofler 1 kg","Løg 1 kg","Hvidløg","Broccoli","Blomkål","Spinat 200 g","Icebergsalat","Squash","Champignon 250 g","Porre","Rødbeder","Hvidkål","Rødkål","Ingefær","Frisk basilikum"],
"Kød & fisk":["Hakket oksekød 8-12% 500 g","Hakket svinekød 500 g","Hakket kylling 500 g","Kyllingebryst 900 g","Kyllingelår 1 kg","Medister 400 g","Bacon i skiver 150 g","Pølser 8 stk.","Leverpostej 400 g","Hamburgerryg","Kogt skinke 100 g","Laksefilet 400 g","Torskefilet 400 g","Rejer 250 g","Tun på dåse 185 g","Makrel i tomat 170 g","Frikadeller 500 g"],
"Kolonial":["Spaghetti 500 g","Penne 500 g","Ris 1 kg","Basmatiris 1 kg","Havregryn 1 kg","Mysli 750 g","Cornflakes 500 g","Hvedemel 1 kg","Sukker 1 kg","Salt 1 kg","Peber","Rapsolie 1 L","Olivenolie 500 ml","Hakkede tomater 400 g","Tomatpuré 140 g","Flåede tomater 400 g","Kidneybønner 400 g","Kikærter 400 g","Majs 340 g","Linser 500 g","Kokosmælk 400 ml","Bouillon","Ketchup 500 g","Sennep","Mayonnaise","Marmelade 400 g","Nutella 400 g","Jordnøddesmør 340 g","Honning 350 g","Leverpostej på dåse","Pesto 190 g"],
"Drikkevarer":["Appelsinjuice 1 L","Æblejuice 1 L","Danskvand 1,5 L","Cola 1,5 L","Cola Zero 1,5 L","Faxe Kondi 1,5 L","Kaffe formalet 400 g","Kaffekapsler","Te 20 breve","Øl 6 stk.","Rødvin 75 cl","Hvidvin 75 cl","Havredrik 1 L","Sojadrik 1 L"],
"Frost":["Frosne ærter 1 kg","Frossen spinat 500 g","Frosne grøntsager 1 kg","Pizza","Pommes frites 750 g","Is 1 L","Frosne jordbær 500 g","Fiskefileter paneret","Frosne boller"],
"Snacks & sødt":["Chips 170 g","Chokolade 200 g","Lakrids","Vingummi","Kiks","Popcorn","Nødder 200 g","Rosiner 200 g","Småkager"],
"Husholdning":["Toiletpapir 8 ruller","Køkkenrulle 4 ruller","Opvasketabs","Opvaskemiddel","Vaskepulver","Skyllemiddel","Håndsæbe","Shampoo","Tandpasta","Affaldsposer","Bagepapir","Alufolie","Frysepose"]
};
const ITEMS=Object.entries(CATALOG).flatMap(([c,l])=>l.map(n=>({name:n,cat:c})));
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const KEY="minkurv.kurv.v1";
let basket=[];
try{basket=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){basket=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(basket))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function add(name,cat,qty=1,manual=false){
  name=name.trim().replace(/\s+/g," ");
  if(!name)return;
  const ex=basket.find(b=>norm(b.name)===norm(name));
  if(ex)ex.qty+=qty;
  else basket.push({id:Date.now()+Math.random(),name,cat:cat||"Andet",qty,manual,p:{}});
  save();renderBasket();
}

function renderResults(){
  const q=norm($("q").value),ul=$("results");
  if(!q){ul.innerHTML='<li class="empty">Begynd at skrive for at søge i varer.</li>';return}
  const words=q.split(/\s+/);
  const hits=ITEMS.filter(i=>{const n=norm(i.name);return words.every(w=>n.includes(w))})
    .sort((a,b)=>norm(a.name).indexOf(words[0])-norm(b.name).indexOf(words[0])).slice(0,30);
  let html=hits.map((h,i)=>`<li><span class="n">${esc(h.name)}<br><small>${esc(h.cat)}</small></span><button class="primary" data-i="${i}">Tilføj</button></li>`).join("");
  html+=`<li><span class="n">${hits.length?"Kan du ikke finde den?":"Ingen varer fundet."} <small>Tilføj “${esc($("q").value.trim())}” som egen vare</small></span><button data-own="1">Tilføj</button></li>`;
  ul.innerHTML=html;ul._hits=hits;
}

function renderBasket(){
  const ul=$("basket");
  if(!basket.length){ul.innerHTML='<li class="empty">Kurven er tom. Søg efter en vare for at komme i gang.</li>'}
  else ul.innerHTML=basket.map(b=>`<li data-id="${b.id}"><span class="n"><b>${esc(b.name)}</b>${b.manual?'<span class="tag">egen</span>':""}<br><small class="cat">${esc(b.cat)}</small></span>
    <span class="qty"><button data-a="dec" aria-label="Færre">−</button><span>${b.qty}</span><button data-a="inc" aria-label="Flere">+</button></span>
    <button class="del" data-a="del" aria-label="Fjern ${esc(b.name)}">✕</button></li>`).join("");
  const lines=basket.length,units=basket.reduce((s,b)=>s+b.qty,0);
  $("count").textContent=lines?`(${lines})`:"";
  $("sum").textContent=lines?`${lines} ${lines===1?"vare":"varer"} · ${units} i alt`:"";
  $("clear").hidden=!lines;renderCmp();
}

const STORES=["Netto","Rema 1000","Føtex","Bilka","Lidl","Aldi","Coop 365","SuperBrugsen"];
const kr=n=>n.toLocaleString("da-DK",{minimumFractionDigits:2,maximumFractionDigits:2})+" kr.";
function renderCmp(){
  const box=$("cmp");
  if(!basket.length){box.innerHTML='<p class="empty">Tilføj varer til kurven for at sammenligne priser.</p>';$("verdict").textContent="";return}
  const head='<tr><th>Vare</th><th>Antal</th>'+STORES.map(s=>`<th>${s}</th>`).join("")+'</tr>';
  const rows=basket.map(b=>`<tr><td>${esc(b.name)}</td><td>${b.qty}</td>`+STORES.map(s=>`<td><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="–" aria-label="${esc(b.name)} i ${s}" data-id="${b.id}" data-s="${s}" value="${b.p&&b.p[s]!=null?b.p[s]:""}"></td>`).join("")+'</tr>').join("");
  const foot='<tr class="tot"><td colspan="2">Samlet</td>'+STORES.map(s=>`<td data-t="${s}"></td>`).join("")+'</tr>';
  box.innerHTML=`<table class="cmp"><thead>${head}</thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table>`;
  updateTotals();
}
function updateTotals(){
  const res=STORES.map(s=>{let sum=0,miss=0;basket.forEach(b=>{const v=b.p&&b.p[s];if(v>0)sum+=v*b.qty;else miss++});return{s,sum,miss}});
  const full=res.filter(r=>r.miss===0);
  const best=full.length?full.reduce((a,b)=>b.sum<a.sum?b:a):null;
  res.forEach(r=>{const td=document.querySelector(`[data-t="${r.s}"]`);if(!td)return;
    td.className=best&&r===best?"best":"";
    td.innerHTML=(r.sum?kr(r.sum):"–")+(r.miss?`<br><small>mangler ${r.miss}</small>`:"")});
  const v=$("verdict");
  if(!best)v.textContent="Udfyld priser for alle varer i mindst én butik for at se, hvilken der er billigst.";
  else{const worst=full.reduce((a,b)=>b.sum>a.sum?b:a);
    v.innerHTML=`<b>Billigst: ${best.s}</b> – ${kr(best.sum)}`+(full.length>1?` (${kr(worst.sum-best.sum)} billigere end ${worst.s})`:"")}
}
$("cmp").addEventListener("input",e=>{
  const i=e.target;if(!i.dataset||!i.dataset.s)return;
  const it=basket.find(x=>String(x.id)===i.dataset.id);if(!it)return;
  it.p=it.p||{};const v=parseFloat(i.value);
  if(v>=0)it.p[i.dataset.s]=v;else delete it.p[i.dataset.s];
  save();updateTotals();
});
$("q").addEventListener("input",renderResults);
$("q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){const h=$("results")._hits;if(h&&h[0])add(h[0].name,h[0].cat);else if($("q").value.trim())add($("q").value,"Andet",1,true);}
});
$("results").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.own){add($("q").value,"Andet",1,true)}
  else{const h=$("results")._hits[+b.dataset.i];add(h.name,h.cat)}
  b.textContent="✓";setTimeout(()=>b.textContent="Tilføj",700);
});
$("basket").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const li=b.closest("li"),it=basket.find(x=>String(x.id)===li.dataset.id);if(!it)return;
  if(b.dataset.a==="inc")it.qty++;
  else if(b.dataset.a==="dec")it.qty=Math.max(1,it.qty-1);
  else basket=basket.filter(x=>x!==it);
  save();renderBasket();
});
$("clear").addEventListener("click",()=>{if(confirm("Tøm hele kurven?")){basket=[];save();renderBasket()}});

$("mCat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("mCat").value="Andet";
function manualAdd(){
  const n=$("mName").value;if(!n.trim()){$("mName").focus();return}
  add(n,$("mCat").value,Math.max(1,parseInt($("mQty").value)||1),true);
  $("mName").value="";$("mQty").value=1;$("mName").focus();
}
$("mAdd").addEventListener("click",manualAdd);
$("mName").addEventListener("keydown",e=>{if(e.key==="Enter")manualAdd()});

renderResults();renderBasket();
</script>
</body>
</html>
